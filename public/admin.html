<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Admin Panel - Generator Fuel Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #111827;
    }

    .app-shell {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      background: #0b1220;
      color: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      opacity: 0.75;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 8px 0 0;
      opacity: 0.8;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 20px;
    }

    .field {
      display: block;
      margin-bottom: 15px;
    }

    .field span {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
      margin-top: 5px;
    }

    .primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
      margin-top: 10px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #065f46;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
    }

    .site-info {
      display: none;
      border-top: 1px solid #e5e7eb;
      margin-top: 20px;
      padding-top: 18px;
    }

    .site-info.show {
      display: block;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-row span:first-child {
      color: #6b7280;
    }

    .info-row strong {
      text-align: right;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      padding: 10px 0 20px;
    }
  </style>
</head>

<body>

  <main class="app-shell">

    <header class="topbar">
      <p class="eyebrow">GENERATOR TOOL</p>
      <h1>Admin Panel</h1>
      <p class="subtitle">Update generator site readings.</p>
    </header>

    <!-- ADMIN AUTHENTICATION -->

    <section class="card">
      <h2>Administrator</h2>

      <label class="field">
        <span>Admin Key</span>
        <input
          id="adminKey"
          type="password"
          autocomplete="off"
          placeholder="Enter admin key"
        >
      </label>

      <button id="loadSite" class="secondary">
        Load Site
      </button>

      <div id="authMessage" class="message"></div>
    </section>


    <!-- SITE DATA -->

    <section class="card">

      <h2>Site Information</h2>

      <label class="field">
        <span>Site ID</span>
        <input
          id="siteId"
          type="text"
          value="TEST001"
          placeholder="e.g. TEST001"
        >
      </label>

      <div id="siteInfo" class="site-info">

        <div class="info-row">
          <span>Site name</span>
          <strong id="siteName">—</strong>
        </div>

        <div class="info-row">
          <span>Current model</span>
          <strong id="siteModel">—</strong>
        </div>

        <div class="info-row">
          <span>Current HMR</span>
          <strong id="siteHmr">—</strong>
        </div>

        <div class="info-row">
          <span>Current kWh</span>
          <strong id="siteKwh">—</strong>
        </div>

        <div class="info-row">
          <span>Current balance</span>
          <strong id="siteBalance">—</strong>
        </div>

        <div class="info-row">
          <span>Last updated</span>
          <strong id="siteUpdated">—</strong>
        </div>

      </div>

    </section>


    <!-- UPDATE FORM -->

    <section class="card">

      <h2>Update Generator</h2>

      <label class="field">
        <span>Generator model</span>

        <select id="model">

          <option value="eicher10">
            Eicher 10 KVA
          </option>

          <option value="eicher20">
            Eicher 20 KVA
          </option>

          <option value="koel20">
            KOEL 20 KVA
          </option>

          <option value="mahindra20">
            Mahindra 20 KVA
          </option>

          <option value="mahindra10">
            Mahindra 10 KVA
          </option>

        </select>
      </label>


      <label class="field">
        <span>Current HMR</span>

        <input
          id="currentHmr"
          type="number"
          inputmode="decimal"
          step="any"
          placeholder="e.g. 101"
        >
      </label>


      <label class="field">
        <span>Current kWh</span>

        <input
          id="currentKwh"
          type="number"
          inputmode="decimal"
          step="any"
          placeholder="e.g. 252"
        >
      </label>


      <label class="field">
        <span>Current balance</span>

        <input
          id="currentBalance"
          type="number"
          inputmode="decimal"
          step="any"
          placeholder="e.g. 490"
        >
      </label>


      <button id="updateSite" class="primary">
        Update Site
      </button>

      <button id="clearForm" class="secondary">
        Clear
      </button>

      <div id="updateMessage" class="message"></div>

    </section>


    <footer>
      Admin changes are saved to the generator fuel database.
    </footer>

  </main>


  <script>

    const $ = (id) => document.getElementById(id);


    function showMessage(element, message, type) {

      element.textContent = message;

      element.className = "message " + type;

    }


    function clearMessage(element) {

      element.textContent = "";

      element.className = "message";

    }


    function showSite(site) {

      $("siteInfo").classList.add("show");

      $("siteName").textContent =
        site.site_name ?? "—";

      $("siteModel").textContent =
        site.model ?? "—";

      $("siteHmr").textContent =
        site.current_hmr ?? "—";

      $("siteKwh").textContent =
        site.current_kwh ?? "—";

      $("siteBalance").textContent =
        site.current_balance ?? "—";

      $("siteUpdated").textContent =
        site.last_updated ?? "—";


      if (site.model) {

        $("model").value = site.model;

      }

      if (site.current_hmr !== null &&
          site.current_hmr !== undefined) {

        $("currentHmr").value =
          site.current_hmr;

      }

      if (site.current_kwh !== null &&
          site.current_kwh !== undefined) {

        $("currentKwh").value =
          site.current_kwh;

      }

      if (site.current_balance !== null &&
          site.current_balance !== undefined) {

        $("currentBalance").value =
          site.current_balance;

      }

    }


    $("loadSite").addEventListener("click", async () => {

      clearMessage($("authMessage"));

      const adminKey =
        $("adminKey").value.trim();

      const siteId =
        $("siteId").value.trim();


      if (!adminKey) {

        showMessage(
          $("authMessage"),
          "Please enter the admin key.",
          "error"
        );

        return;

      }


      if (!siteId) {

        showMessage(
          $("authMessage"),
          "Please enter a Site ID.",
          "error"
        );

        return;

      }


      $("loadSite").disabled = true;

      $("loadSite").textContent = "Loading...";


      try {

        const response = await fetch(
          "/api/site?site_id=" +
          encodeURIComponent(siteId),
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          }
        );


        const text =
          await response.text();

        let data = {};


        if (text.trim()) {

          try {

            data = JSON.parse(text);

          } catch (error) {

            throw new Error(
              "Server returned invalid JSON."
            );

          }

        }


        if (!response.ok || !data.success) {

          throw new Error(
            data.error ||
            "Unable to load site."
          );

        }


        showSite(data.site);


        showMessage(
          $("authMessage"),
          "Site loaded successfully.",
          "success"
        );


      } catch (error) {

        $("siteInfo").classList.remove("show");

        showMessage(
          $("authMessage"),
          error.message ||
          "Unable to load site.",
          "error"
        );

      } finally {

        $("loadSite").disabled = false;

        $("loadSite").textContent = "Load Site";

      }

    });


    $("updateSite").addEventListener("click", async () => {

      clearMessage($("updateMessage"));


      const adminKey =
        $("adminKey").value.trim();

      const siteId =
        $("siteId").value.trim();

      const model =
        $("model").value;

      const currentHmr =
        $("currentHmr").value;

      const currentKwh =
        $("currentKwh").value;

      const currentBalance =
        $("currentBalance").value;


      if (!adminKey) {

        showMessage(
          $("updateMessage"),
          "Please enter the admin key.",
          "error"
        );

        return;

      }


      if (!siteId) {

        showMessage(
          $("updateMessage"),
          "Site ID is required.",
          "error"
        );

        return;

      }


      if (currentHmr === "") {

        showMessage(
          $("updateMessage"),
          "Current HMR is required.",
          "error"
        );

        return;

      }


      if (currentKwh === "") {

        showMessage(
          $("updateMessage"),
          "Current kWh is required.",
          "error"
        );

        return;

      }


      if (currentBalance === "") {

        showMessage(
          $("updateMessage"),
          "Current balance is required.",
          "error"
        );

        return;

      }


      const payload = {

        site_id: siteId,

        model: model,

        current_hmr: currentHmr,

        current_kwh: currentKwh,

        current_balance: currentBalance

      };


      $("updateSite").disabled = true;

      $("updateSite").textContent =
        "Updating...";


      try {

        const response = await fetch(
          "/api/admin/update-site",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json",

              "X-Admin-Key":
                adminKey
            },

            body:
              JSON.stringify(payload)
          }
        );


        const text =
          await response.text();

        let data = {};


        if (text.trim()) {

          try {

            data = JSON.parse(text);

          } catch (error) {

            throw new Error(
              "Server returned invalid JSON."
            );

          }

        }


        if (!response.ok || !data.success) {

          throw new Error(
            data.error ||
            "Site update failed."
          );

        }


        showMessage(
          $("updateMessage"),
          "Site updated successfully.",
          "success"
        );


        // Refresh the displayed database values.

        try {

          const siteResponse =
            await fetch(
              "/api/site?site_id=" +
              encodeURIComponent(siteId)
            );

          const siteText =
            await siteResponse.text();

          const siteData =
            siteText.trim()
              ? JSON.parse(siteText)
              : {};

          if (
            siteResponse.ok &&
            siteData.success
          ) {

            showSite(siteData.site);

          }

        } catch (refreshError) {

          // Update itself already succeeded.

        }


      } catch (error) {

        showMessage(
          $("updateMessage"),
          error.message ||
          "Site update failed.",
          "error"
        );

      } finally {

        $("updateSite").disabled = false;

        $("updateSite").textContent =
          "Update Site";

      }

    });


    $("clearForm").addEventListener("click", () => {

      $("currentHmr").value = "";

      $("currentKwh").value = "";

      $("currentBalance").value = "";

      $("model").selectedIndex = 0;

      $("siteInfo").classList.remove("show");

      clearMessage($("authMessage"));

      clearMessage($("updateMessage"));

    });

  </script>

</body>
</html>
