<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Generator Fuel Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">GENERATOR TOOL</p>
        <h1>Fuel Calculator</h1>
        <p class="subtitle">Enter meter readings and get the balance.</p>
      </div>
      <div class="badge">v1</div>
    </header>
    <section class="card">
      <h2>Generator</h2>
      <label class="field">
        <span>Generator model</span>
        <select id="model">
          <option value="eicher10">Eicher 10 KVA</option>
          <option value="eicher20">Eicher 20 KVA</option>
          <option value="koel20">KOEL 20 KVA</option>
          <option value="mahindra20">Mahindra 20 KVA</option>
          <option value="mahindra10">Mahindra 10 KVA</option>
        </select>
      </label>
    </section>
    <section class="card">
      <h2>Meter readings</h2>
      <div class="grid">
        <label class="field"><span>A · Current HMR</span><input id="a" type="number" inputmode="decimal" step="any" placeholder="e.g. 1250.5"></label>
        <label class="field"><span>B · Current kWh</span><input id="b" type="number" inputmode="decimal" step="any" placeholder="e.g. 4200.75"></label>
        <label class="field"><span>C · Previous HMR</span><input id="c" type="number" inputmode="decimal" step="any" placeholder="e.g. 1240.5"></label>
        <label class="field"><span>D · Previous kWh</span><input id="d" type="number" inputmode="decimal" step="any" placeholder="e.g. 4150.25"></label>
        <label class="field full"><span>E · Previous balance after filling</span><input id="e" type="number" inputmode="decimal" step="any" placeholder="e.g. 50"></label>
      </div>
      <button id="calculate" class="primary">Calculate result</button>
      <button id="clear" class="secondary">Clear</button>
      <p id="error" class="error" role="alert"></p>
    </section>
    <section id="resultCard" class="card result-card hidden">
      <div class="result-label">FINAL ANSWER · T</div>
      <div id="result" class="result">—</div>
      <div id="resultUnit" class="result-unit">Litres</div>
      <div class="breakdown">
        <div><span>Z = A − C</span><strong id="z">—</strong></div>
        <div><span>Y = B − D</span><strong id="y">—</strong></div>
        <div><span>X = Y ÷ Z</span><strong id="x">—</strong></div>
        <div><span>L from chart</span><strong id="l">—</strong></div>
        <div><span>S = L × Z</span><strong id="s">—</strong></div>
        <div><span>T = E − S</span><strong id="t">—</strong></div>
      </div>
      <p id="band" class="chart-note"></p>
    </section>
    <footer><span>Calculations are performed through the calculator API.</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
