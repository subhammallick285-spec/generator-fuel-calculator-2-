<script>
const $ = (id) => document.getElementById(id);

function message(element, text, type) {
  element.textContent = text;
  element.className = "message " + type;
}

function clearMessage(element) {
  element.textContent = "";
  element.className = "message";
}


/* =========================
   LOAD SITE
========================= */

$("loadSite").addEventListener("click", async () => {

  clearMessage($("authMessage"));

  const siteId = $("siteId").value.trim();

  if (!siteId) {
    message(
      $("authMessage"),
      "Please enter a Site ID.",
      "error"
    );
    return;
  }

  $("loadSite").disabled = true;
  $("loadSite").textContent = "Loading...";

  try {

    const response = await fetch(
      "/api/site?site_id=" +
      encodeURIComponent(siteId)
    );

    const text = await response.text();

    const data = text.trim()
      ? JSON.parse(text)
      : {};

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Unable to load site."
      );
    }

    const site = data.site;

    $("siteInfo").classList.add("show");

    $("siteName").textContent =
      site.site_name ?? "—";

    $("siteModel").textContent =
      site.model ?? "—";

    $("siteHmr").textContent =
      site.current_hmr ?? "—";

    $("siteKwh").textContent =
      site.current_kwh ?? "—";

    $("siteBalance").textContent =
      site.current_balance ?? "—";

    if (site.model) {
      $("model").value = site.model;
      $("extractedModel").value = site.model;
    }

    if (site.current_hmr != null) {
      $("currentHmr").value = site.current_hmr;
    }

    if (site.current_kwh != null) {
      $("currentKwh").value = site.current_kwh;
    }

    if (site.current_balance != null) {
      $("currentBalance").value = site.current_balance;
    }

    message(
      $("authMessage"),
      "Site loaded successfully.",
      "success"
    );

  } catch (error) {

    message(
      $("authMessage"),
      error.message || "Unable to load site.",
      "error"
    );

  } finally {

    $("loadSite").disabled = false;
    $("loadSite").textContent =
      "Load Existing Site";

  }
});


/* =========================
   IMAGE SELECTION
========================= */

$("imageInput").addEventListener("change", function () {

  const file = this.files && this.files[0];

  if (!file) {
    return;
  }

  clearMessage($("authMessage"));

  if (!file.type.startsWith("image/")) {

    message(
      $("authMessage"),
      "Please select an image file.",
      "error"
    );

    this.value = "";
    return;
  }

  /*
   * Show preview immediately.
   */

  const objectUrl = URL.createObjectURL(file);

  $("previewImage").src = objectUrl;

  $("fileName").textContent =
    file.name;

  $("preview").classList.add("show");

  /*
   * Make sure extraction section is hidden
   * until extraction actually happens.
   */

  $("extractionSection").style.display =
    "none";

  message(
    $("authMessage"),
    "Image selected successfully.",
    "success"
  );
});


/* =========================
   MANUAL ENTRY BUTTON
========================= */

$("manualButton").addEventListener("click", function () {

  const section = $("manualSection");

  const isHidden =
    !section.classList.contains("show");

  if (isHidden) {

    section.classList.add("show");

    section.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } else {

    section.classList.remove("show");

  }
});


/* =========================
   IMAGE EXTRACTION
========================= */

$("extractButton").addEventListener(
  "click",
  async function () {

    const file =
      $("imageInput").files &&
      $("imageInput").files[0];

    const siteId =
      $("siteId").value.trim();

    const adminKey =
      $("adminKey").value.trim();

    if (!file) {

      message(
        $("authMessage"),
        "Please upload an image first.",
        "error"
      );

      return;
    }

    if (!siteId) {

      message(
        $("authMessage"),
        "Please enter the Site ID first.",
        "error"
      );

      return;
    }

    if (!adminKey) {

      message(
        $("authMessage"),
        "Please enter the admin key first.",
        "error"
      );

      return;
    }

    $("extractButton").disabled = true;

    $("extractButton").textContent =
      "Extracting...";

    clearMessage($("authMessage"));

    try {

      const formData = new FormData();

      formData.append(
        "image",
        file
      );

      formData.append(
        "site_id",
        siteId
      );

      const response = await fetch(
        "/api/admin/extract-image",
        {
          method: "POST",

          headers: {
            "X-Admin-Key":
              adminKey
          },

          body: formData
        }
      );

      const text =
        await response.text();

      const data =
        text.trim()
          ? JSON.parse(text)
          : {};

      if (!response.ok || !data.success) {

        throw new Error(
          data.error ||
          "Image extraction failed."
        );
      }


      /*
       * Populate extracted fields.
       */

      if (data.model) {
        $("extractedModel").value =
          data.model;
      }

      if (data.current_hmr != null) {
        $("extractedHmr").value =
          data.current_hmr;
      }

      if (data.current_kwh != null) {
        $("extractedKwh").value =
          data.current_kwh;
      }

      if (data.current_balance != null) {
        $("extractedBalance").value =
          data.current_balance;
      }


      /*
       * Show confirmation section.
       */

      $("extractionSection").style.display =
        "block";

      $("extractionSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      message(
        $("authMessage"),
        "Details extracted. Please review and confirm them.",
        "success"
      );

    } catch (error) {

      message(
        $("authMessage"),
        error.message ||
        "Image extraction failed.",
        "error"
      );

    } finally {

      $("extractButton").disabled =
        false;

      $("extractButton").textContent =
        "Extract Details";

    }
  }
);


/* =========================
   SAVE MANUAL READING
========================= */

$("updateSite").addEventListener(
  "click",
  async function () {

    clearMessage(
      $("updateMessage")
    );

    const adminKey =
      $("adminKey").value.trim();

    const siteId =
      $("siteId").value.trim();

    const model =
      $("model").value;

    const hmr =
      $("currentHmr").value;

    const kwh =
      $("currentKwh").value;

    const balance =
      $("currentBalance").value;

    if (!adminKey) {

      message(
        $("updateMessage"),
        "Please enter the admin key.",
        "error"
      );

      return;
    }

    if (!siteId) {

      message(
        $("updateMessage"),
        "Site ID is required.",
        "error"
      );

      return;
    }

    if (
      hmr === "" ||
      kwh === "" ||
      balance === ""
    ) {

      message(
        $("updateMessage"),
        "Please fill all manual reading fields.",
        "error"
      );

      return;
    }

    $("updateSite").disabled = true;

    $("updateSite").textContent =
      "Saving...";

    try {

      const response =
        await fetch(
          "/api/admin/update-site",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json",

              "X-Admin-Key":
                adminKey
            },

            body:
              JSON.stringify({
                site_id:
                  siteId,

                model:
                  model,

                current_hmr:
                  hmr,

                current_kwh:
                  kwh,

                current_balance:
                  balance
              })
          }
        );

      const text =
        await response.text();

      const data =
        text.trim()
          ? JSON.parse(text)
          : {};

      if (!response.ok || !data.success) {

        throw new Error(
          data.error ||
          "Site update failed."
        );
      }

      message(
        $("updateMessage"),
        "Site updated successfully.",
        "success"
      );

      /*
       * Refresh displayed site information.
       */

      $("siteHmr").textContent =
        hmr;

      $("siteKwh").textContent =
        kwh;

      $("siteBalance").textContent =
        balance;

      $("siteModel").textContent =
        model;

      $("siteInfo").classList.add("show");

    } catch (error) {

      message(
        $("updateMessage"),
        error.message ||
        "Site update failed.",
        "error"
      );

    } finally {

      $("updateSite").disabled =
        false;

      $("updateSite").textContent =
        "Save Manual Reading";

    }
  }
);


/* =========================
   SAVE EXTRACTED READING
========================= */

$("saveExtracted").addEventListener(
  "click",
  async function () {

    clearMessage(
      $("extractMessage")
    );

    const adminKey =
      $("adminKey").value.trim();

    const siteId =
      $("siteId").value.trim();

    const model =
      $("extractedModel").value;

    const hmr =
      $("extractedHmr").value;

    const kwh =
      $("extractedKwh").value;

    const balance =
      $("extractedBalance").value;

    if (!adminKey) {

      message(
        $("extractMessage"),
        "Please enter the admin key.",
        "error"
      );

      return;
    }

    if (!siteId) {

      message(
        $("extractMessage"),
        "Site ID is required.",
        "error"
      );

      return;
    }

    if (
      hmr === "" ||
      kwh === "" ||
      balance === ""
    ) {

      message(
        $("extractMessage"),
        "Please review all extracted fields.",
        "error"
      );

      return;
    }

    $("saveExtracted").disabled =
      true;

    $("saveExtracted").textContent =
      "Saving...";

    try {

      const response =
        await fetch(
          "/api/admin/update-site",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json",

              "X-Admin-Key":
                adminKey
            },

            body:
              JSON.stringify({
                site_id:
                  siteId,

                model:
                  model,

                current_hmr:
                  hmr,

                current_kwh:
                  kwh,

                current_balance:
                  balance
              })
          }
        );

      const text =
        await response.text();

      const data =
        text.trim()
          ? JSON.parse(text)
          : {};

      if (!response.ok || !data.success) {

        throw new Error(
          data.error ||
          "Save failed."
        );
      }

      message(
        $("extractMessage"),
        "Extracted reading saved successfully.",
        "success"
      );


      /*
       * Update site display.
       */

      $("siteModel").textContent =
        model;

      $("siteHmr").textContent =
        hmr;

      $("siteKwh").textContent =
        kwh;

      $("siteBalance").textContent =
        balance;

      $("siteInfo").classList.add("show");


      /*
       * Image is not uploaded to storage.
       * We simply clear the local file reference
       * after successful saving.
       */

      $("imageInput").value = "";

      $("previewImage").src = "";

      $("fileName").textContent = "";

      $("preview").classList.remove("show");

    } catch (error) {

      message(
        $("extractMessage"),
        error.message ||
        "Save failed.",
        "error"
      );

    } finally {

      $("saveExtracted").disabled =
        false;

      $("saveExtracted").textContent =
        "Confirm & Save";

    }
  }
);
</script>
