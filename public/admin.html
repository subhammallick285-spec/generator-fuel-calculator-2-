<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050817"
  >

  <title>Generator Admin</title>


  <!-- =======================================================
       ADMIN KEY GATE + MAIN PAGE CSS
  ======================================================== -->

  <style>

    :root {
      --bg: #050817;
      --bg2: #080d25;

      --card: rgba(13, 20, 47, 0.82);
      --card-strong: rgba(17, 25, 57, 0.94);

      --border: rgba(110, 130, 190, 0.20);
      --border-blue: rgba(0, 217, 255, 0.28);

      --text: #ffffff;
      --muted: #9ca8c7;

      --cyan: #00d9ff;
      --purple: #9b35ff;
      --green: #00e6a8;
      --red: #ff6478;
      --yellow: #ffd166;

      --shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }


    * {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
      background: var(--bg);
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(0, 217, 255, 0.07),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(155, 53, 255, 0.08),
          transparent 32%
        ),
        var(--bg);

      overflow-x: hidden;
    }


    button,
    input,
    select,
    textarea {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    /* =======================================================
       ADMIN KEY LOCK
    ======================================================== */

    body.admin-locked {
      overflow: hidden;
    }


    body.admin-locked > *:not(#adminGate) {
      visibility: hidden;
    }


    #adminGate {
      position: fixed;
      inset: 0;

      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(0, 217, 255, 0.12),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #030512,
          #080d25,
          #050817
        );

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.65s ease,
        visibility 0.65s ease;
    }


    #adminGate.unlocking {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    .admin-gate-box {
      width: min(100%, 390px);

      padding: 30px 22px 24px;

      text-align: center;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(20, 29, 68, 0.94),
          rgba(8, 13, 34, 0.92)
        );

      border:
        1px solid
        rgba(91, 126, 255, 0.35);

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(0, 217, 255, 0.10);

      backdrop-filter: blur(22px);

      animation:
        adminGateEnter
        0.75s
        cubic-bezier(.16, 1, .3, 1);
    }


    .admin-lock {
      width: 78px;
      height: 78px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 24px;

      font-size: 34px;

      background:
        linear-gradient(
          135deg,
          rgba(0, 217, 255, 0.18),
          rgba(155, 53, 255, 0.28)
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      box-shadow:
        0 0 25px rgba(0, 217, 255, 0.20),
        0 0 55px rgba(155, 53, 255, 0.12);

      animation:
        lockPulse
        2.5s
        ease-in-out
        infinite;
    }


    .admin-lock.unlocked {
      animation:
        unlockPop
        0.55s
        cubic-bezier(.16, 1, .3, 1);
    }


    .admin-gate-title {
      margin: 0;

      font-size: 25px;
      font-weight: 800;

      color: white;
    }


    .admin-gate-subtitle {
      margin: 8px 0 22px;

      color: #9ca8c7;

      font-size: 13px;
    }


    #adminGateKey {
      width: 100%;

      padding: 14px 15px;

      border-radius: 12px;

      border:
        1px solid
        rgba(110, 130, 190, 0.30);

      background:
        rgba(3, 7, 20, 0.80);

      color: white;

      font-size: 16px;

      text-align: center;

      letter-spacing: 2px;

      outline: none;
    }


    #adminGateKey::placeholder {
      color: #687493;
    }


    #adminGateKey:focus {
      border-color: var(--cyan);

      box-shadow:
        0 0 0 3px rgba(0, 217, 255, 0.08),
        0 0 22px rgba(0, 217, 255, 0.15);
    }


    #adminGateButton {
      width: 100%;

      margin-top: 14px;
    }


    #adminGateMessage {
      min-height: 20px;

      margin-top: 10px;

      font-size: 12px;
      font-weight: 600;
    }


    #adminGateMessage.error {
      color: var(--red);
    }


    #adminGateMessage.success {
      color: var(--green);
    }


    @keyframes adminGateEnter {

      from {
        opacity: 0;

        transform:
          translateY(25px)
          scale(0.94);

        filter: blur(8px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);
      }
    }


    @keyframes lockPulse {

      0%,
      100% {
        transform: scale(1);

        box-shadow:
          0 0 25px rgba(0, 217, 255, 0.20),
          0 0 55px rgba(155, 53, 255, 0.12);
      }

      50% {
        transform: scale(1.04);

        box-shadow:
          0 0 35px rgba(0, 217, 255, 0.38),
          0 0 70px rgba(155, 53, 255, 0.22);
      }
    }


    @keyframes unlockPop {

      0% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.18);
      }

      100% {
        transform: scale(1);
      }
    }


    /* =======================================================
       PAGE BACKGROUND
    ======================================================== */

    .background {
      position: fixed;
      inset: 0;

      z-index: -1;

      pointer-events: none;

      overflow: hidden;
    }


    .background::before {
      content: "";

      position: absolute;

      width: 420px;
      height: 420px;

      top: -180px;
      left: -160px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(0, 217, 255, 0.09),
          transparent 70%
        );

      filter: blur(15px);
    }


    .background::after {
      content: "";

      position: absolute;

      width: 460px;
      height: 460px;

      right: -200px;
      bottom: -220px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(155, 53, 255, 0.10),
          transparent 70%
        );

      filter: blur(18px);
    }


    /* =======================================================
       MAIN APP
    ======================================================== */

    .app {
      width: 100%;
      min-height: 100vh;
    }


    .container {
      width: min(100%, 1100px);

      margin: 0 auto;

      padding:
        18px
        16px
        50px;
    }


    /* =======================================================
       HEADER
    ======================================================== */

    .header {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 14px;

      margin-bottom: 22px;

      padding: 18px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(16, 25, 58, 0.90),
          rgba(7, 12, 32, 0.82)
        );

      border:
        1px solid
        var(--border);

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
    }


    .brand {
      min-width: 0;
    }


    .brand h1 {
      margin: 0;

      font-size: clamp(20px, 5vw, 28px);

      font-weight: 850;

      letter-spacing: -0.5px;
    }


    .brand p {
      margin: 5px 0 0;

      color: var(--muted);

      font-size: 12px;
    }


    /* =======================================================
       NOTIFICATION BELL
    ======================================================== */

    .notification-button {
      position: relative;

      flex: 0 0 auto;

      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      border:
        1px solid
        rgba(110, 130, 190, 0.28);

      background:
        rgba(7, 13, 32, 0.82);

      color: white;

      font-size: 19px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }


    .notification-button:hover,
    .notification-button:focus-visible {
      transform: translateY(-1px);

      border-color:
        rgba(0, 217, 255, 0.45);

      box-shadow:
        0 0 20px
        rgba(0, 217, 255, 0.12);

      outline: none;
    }


    .notification-badge {
      position: absolute;

      top: -2px;
      right: -1px;

      min-width: 17px;
      height: 17px;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 0 4px;

      border-radius: 50%;

      background: var(--red);

      color: white;

      font-size: 10px;
      font-weight: 800;

      border:
        2px solid
        #080d25;
    }


    .notification-badge.show {
      display: flex;
    }


    /* =======================================================
       CARDS
    ======================================================== */

    .grid {
      display: grid;

      grid-template-columns: 1fr;

      gap: 16px;
    }


    .card {
      padding: 18px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(16, 25, 58, 0.88),
          rgba(7, 12, 32, 0.78)
        );

      border:
        1px solid
        var(--border);

      box-shadow: var(--shadow);

      backdrop-filter: blur(18px);
    }


    .card.full {
      width: 100%;
    }


    .card h2 {
      display: flex;

      align-items: center;

      gap: 9px;

      margin:
        0
        0
        16px;

      font-size: 17px;

      font-weight: 800;
    }


    .icon {
      width: 31px;
      height: 31px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      border-radius: 9px;

      background:
        rgba(0, 217, 255, 0.10);

      border:
        1px solid
        rgba(0, 217, 255, 0.14);

      font-size: 15px;
    }


    /* =======================================================
       FORM ELEMENTS
    ======================================================== */

    label {
      display: block;

      margin:
        0
        0
        7px;

      color: #c6cee4;

      font-size: 12px;
      font-weight: 650;
    }


    input,
    select,
    textarea {
      width: 100%;

      min-height: 46px;

      padding:
        12px
        13px;

      border-radius: 12px;

      border:
        1px solid
        rgba(110, 130, 190, 0.24);

      background:
        rgba(3, 7, 20, 0.72);

      color: white;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }


    input::placeholder,
    textarea::placeholder {
      color: #66718e;
    }


    input:focus,
    select:focus,
    textarea:focus {
      border-color:
        rgba(0, 217, 255, 0.60);

      box-shadow:
        0 0 0 3px
        rgba(0, 217, 255, 0.07);

      background:
        rgba(4, 9, 25, 0.90);
    }


    select {
      appearance: auto;
    }


    .field {
      margin-bottom: 14px;
    }


    .field:last-child {
      margin-bottom: 0;
    }


    /* =======================================================
       BUTTONS
    ======================================================== */

    button {
      min-height: 46px;

      padding:
        11px
        15px;

      border-radius: 12px;

      border: 1px solid transparent;

      font-size: 13px;
      font-weight: 750;

      color: white;

      background:
        linear-gradient(
          135deg,
          #087dff,
          #6b35ff
        );

      box-shadow:
        0 10px 25px
        rgba(40, 76, 255, 0.18);

      transition:
        transform 0.18s ease,
        opacity 0.18s ease,
        box-shadow 0.18s ease;
    }


    button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 13px 30px
        rgba(40, 76, 255, 0.25);
    }


    button:active {
      transform: scale(0.98);
    }


    button:disabled {
      opacity: 0.55;

      cursor: not-allowed;

      transform: none;
    }


    button.secondary {
      width: 100%;

      background:
        rgba(8, 15, 38, 0.88);

      border:
        1px solid
        rgba(110, 130, 190, 0.28);

      box-shadow: none;
    }


    button.secondary:hover {
      border-color:
        rgba(0, 217, 255, 0.42);

      box-shadow:
        0 0 20px
        rgba(0, 217, 255, 0.08);
    }


    button.danger {
      background:
        linear-gradient(
          135deg,
          #d83250,
          #8e2440
        );
    }


    button.success {
      background:
        linear-gradient(
          135deg,
          #00c994,
          #008d82
        );
    }


    /* =======================================================
       SITE SEARCH
    ======================================================== */

    .search-row {
      display: flex;

      gap: 9px;
    }


    .search-row input {
      flex: 1;
      min-width: 0;
    }


    .search-row button {
      flex: 0 0 auto;

      width: 52px;

      padding:
        10px;
    }


    .search-hint {
      margin-top: 8px;

      color: #7884a3;

      font-size: 11px;
      line-height: 1.5;
    }


    /* =======================================================
       SITE RESULT
    ======================================================== */

    .site-result {
      display: none;

      margin-top: 16px;

      padding: 15px;

      border-radius: 15px;

      background:
        rgba(4, 9, 25, 0.62);

      border:
        1px solid
        rgba(110, 130, 190, 0.18);

      animation:
        slideUp
        0.35s
        cubic-bezier(.16, 1, .3, 1);
    }


    .site-result.show {
      display: block;
    }


    .site-title {
      margin: 0;

      font-size: 18px;
      font-weight: 800;
    }


    .site-meta {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12px;
    }


    .site-values {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 8px;

      margin-top: 14px;
    }


    .value-box {
      min-width: 0;

      padding: 11px 8px;

      text-align: center;

      border-radius: 12px;

      background:
        rgba(17, 27, 60, 0.70);

      border:
        1px solid
        rgba(110, 130, 190, 0.15);
    }


    .value-box span {
      display: block;

      margin-bottom: 4px;

      color: #7783a2;

      font-size: 9px;

      text-transform: uppercase;

      letter-spacing: 0.4px;
    }


    .value-box strong {
      display: block;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 13px;
    }


    /* =======================================================
       EDIT / ADD ACTION AREA
    ======================================================== */

    .site-question {
      margin:
        15px
        0
        10px;

      color: #dce3f5;

      font-size: 13px;
      line-height: 1.5;
    }


    .action-row {
      display: flex;

      gap: 9px;
    }


    .action-row button {
      flex: 1;
    }


    .edit-controls {
      display: none;

      margin-top: 15px;

      animation:
        slideUp
        0.35s
        cubic-bezier(.16, 1, .3, 1);
    }


    .edit-controls.show {
      display: block;
    }


    /* =======================================================
       ADD SITE AREA
    ======================================================== */

    .add-site-section {
      display: none;

      margin-top: 16px;

      animation:
        slideUp
        0.35s
        cubic-bezier(.16, 1, .3, 1);
    }


    .add-site-section.show {
      display: block;
    }


    /* =======================================================
       HIDDEN / COLLAPSIBLE SECTIONS
    ======================================================== */

    .hidden {
      display: none !important;
    }


    .manual-section,
    .extraction-section {
      display: none;
    }


    .manual-section.show,
    .extraction-section.show {
      display: block;

      animation:
        slideUp
        0.35s
        cubic-bezier(.16, 1, .3, 1);
    }


    /* =======================================================
       MESSAGES
    ======================================================== */

    .message {
      min-height: 20px;

      margin-top: 10px;

      font-size: 12px;

      line-height: 1.5;
    }


    .message.success {
      color: var(--green);
    }


    .message.error {
      color: var(--red);
    }


    .message.warning {
      color: var(--yellow);
    }


    /* =======================================================
       LOADING
    ======================================================== */

    .loading {
      display: none;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding: 18px;

      color: var(--muted);

      font-size: 12px;
    }


    .loading.show {
      display: flex;
    }


    .spinner {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      border:
        2px solid
        rgba(255, 255, 255, 0.12);

      border-top-color:
        var(--cyan);

      animation:
        spin
        0.8s
        linear
        infinite;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    @keyframes slideUp {

      from {
        opacity: 0;

        transform:
          translateY(12px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* =======================================================
       RESPONSIVE
    ======================================================== */

    @media (min-width: 700px) {

      .container {
        padding:
          28px
          22px
          60px;
      }


      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }


      .card.full {
        grid-column: 1 / -1;
      }


      .header {
        padding: 20px 22px;
      }

    }


    @media (max-width: 420px) {

      .container {
        padding:
          12px
          12px
          40px;
      }


      .card {
        padding: 15px;
      }


      .site-values {
        gap: 5px;
      }


      .value-box {
        padding:
          10px
          5px;
      }


      .value-box strong {
        font-size: 12px;
      }

    }

  </style>

</head>





          



<body class="admin-locked">
  <div id="adminGate">
  <div class="admin-gate-box">

    <div id="adminLock" class="admin-lock">🔒</div>

    <h2 class="admin-gate-title">
      Admin Access
    </h2>

    <p class="admin-gate-subtitle">
      Enter your admin key to continue
    </p>

    <input
      type="password"
      id="adminGateKey"
      placeholder="Admin Key"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >

    <button type="button" id="adminGateButton">
      🔓 UNLOCK ADMIN
    </button>

    <div id="adminGateMessage"></div>

  </div>
  </div>


    

<script src="/admin.js"></script>

</body>
</html>
